<svg width="820" height="200" viewBox="0 0 820 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .arrow1 { animation: flow 1s linear infinite; stroke-dasharray: 6 4; }
      .arrow2 { animation: flow 1s 0.2s linear infinite; stroke-dasharray: 6 4; }
      .arrow3 { animation: flow 1s 0.4s linear infinite; stroke-dasharray: 6 4; }
      .arrow4 { animation: flow 1s 0.6s linear infinite; stroke-dasharray: 6 4; }
      @keyframes flow { to { stroke-dashoffset: -20; } }

      .l1 { animation: slideIn 0.4s 0.05s ease both; }
      .l2 { animation: slideIn 0.4s 0.15s ease both; }
      .l3 { animation: slideIn 0.4s 0.25s ease both; }
      .l4 { animation: slideIn 0.4s 0.35s ease both; }
      .l5 { animation: slideIn 0.4s 0.45s ease both; }
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .offlineBadge { animation: badgePop 0.5s 0.7s ease both; }
      .cloudBadge   { animation: badgePop 0.5s 0.9s ease both; }
      @keyframes badgePop {
        from { opacity: 0; transform: scaleX(0.7); }
        to   { opacity: 1; transform: scaleX(1); }
      }

      .particle1 { animation: particle 3s 0s linear infinite; }
      .particle2 { animation: particle 3s 0.6s linear infinite; }
      .particle3 { animation: particle 3s 1.2s linear infinite; }
      .particle4 { animation: particle 3s 1.8s linear infinite; }
      @keyframes particle {
        0%   { transform: translateX(0);    opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateX(484px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- BG -->
  <rect width="820" height="200" rx="16" fill="#0D1018"/>

  <!-- Subtle bg glows -->
  <ellipse cx="85"  cy="100" rx="70" ry="50" fill="#00D87F" fill-opacity="0.04"/>
  <ellipse cx="413" cy="100" rx="70" ry="50" fill="#00C9B1" fill-opacity="0.04"/>
  <ellipse cx="740" cy="100" rx="70" ry="50" fill="#FF7A1A" fill-opacity="0.04"/>

  <!-- LAYER 1 -->
  <g class="l1">
    <rect x="14" y="44" width="138" height="106" rx="13" fill="#111822" stroke="#00D87F" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="83" y="34" text-anchor="middle" font-family="monospace" font-size="9" fill="#3A5040" letter-spacing="1">LAYER 1</text>
    <text x="83" y="84" text-anchor="middle" font-size="24">🟢</text>
    <text x="83" y="104" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="11" fill="#00D87F">Offline</text>
    <text x="83" y="119" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A6688">Keyword</text>
    <text x="83" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A6688">Classifier</text>
  </g>

  <!-- Arrow 1 -->
  <line class="arrow1" x1="154" y1="97" x2="180" y2="97" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- LAYER 2 -->
  <g class="l2">
    <rect x="182" y="44" width="138" height="106" rx="13" fill="#111822" stroke="#00D87F" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="251" y="34" text-anchor="middle" font-family="monospace" font-size="9" fill="#3A5040" letter-spacing="1">LAYER 2</text>
    <text x="251" y="84" text-anchor="middle" font-size="24">🧠</text>
    <text x="251" y="104" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="11" fill="#00D87F">BiLSTM</text>
    <text x="251" y="119" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A6688">Intent + Entity</text>
    <text x="251" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A6688">NER</text>
  </g>

  <!-- Arrow 2 -->
  <line class="arrow2" x1="322" y1="97" x2="348" y2="97" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- LAYER 3 -->
  <g class="l3">
    <rect x="350" y="44" width="138" height="106" rx="13" fill="#111822" stroke="#00C9B1" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="419" y="34" text-anchor="middle" font-family="monospace" font-size="9" fill="#2A4A48" letter-spacing="1">LAYER 3</text>
    <text x="419" y="84" text-anchor="middle" font-size="24">🔍</text>
    <text x="419" y="104" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="11" fill="#00C9B1">FAISS RAG</text>
    <text x="419" y="119" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A6688">154 violations</text>
    <text x="419" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A6688">semantic search</text>
  </g>

  <!-- Arrow 3 -->
  <line class="arrow3" x1="490" y1="97" x2="516" y2="97" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- LAYER 4 -->
  <g class="l4">
    <rect x="518" y="44" width="138" height="106" rx="13" fill="#111822" stroke="#0FA8FF" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="587" y="34" text-anchor="middle" font-family="monospace" font-size="9" fill="#1A3A55" letter-spacing="1">LAYER 4</text>
    <text x="587" y="84" text-anchor="middle" font-size="24">✨</text>
    <text x="587" y="104" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="11" fill="#0FA8FF">Gemini Flash</text>
    <text x="587" y="119" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A6688">Primary LLM</text>
    <text x="587" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A6688">reasoning layer</text>
  </g>

  <!-- Arrow 4 -->
  <line class="arrow4" x1="658" y1="97" x2="684" y2="97" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- LAYER 5 -->
  <g class="l5">
    <rect x="686" y="44" width="120" height="106" rx="13" fill="#111822" stroke="#FF7A1A" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="746" y="34" text-anchor="middle" font-family="monospace" font-size="9" fill="#4A2A10" letter-spacing="1">LAYER 5</text>
    <text x="746" y="84" text-anchor="middle" font-size="24">🦙</text>
    <text x="746" y="104" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="11" fill="#FF7A1A">Groq</text>
    <text x="746" y="119" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A6688">Llama-3.1-70B</text>
    <text x="746" y="132" text-anchor="middle" font-family="monospace" font-size="9" fill="#5A6688">auto-failover</text>
  </g>

  <!-- Offline bracket -->
  <g class="offlineBadge">
    <rect x="14" y="162" width="306" height="24" rx="7"
          fill="#00D87F" fill-opacity="0.09" stroke="#00D87F" stroke-opacity="0.35" stroke-width="1"/>
    <text x="167" y="178" text-anchor="middle"
          font-family="monospace" font-size="9" fill="#00D87F" letter-spacing="0.5">✓ WORKS FULLY OFFLINE</text>
  </g>

  <!-- Cloud bracket -->
  <g class="cloudBadge">
    <rect x="518" y="162" width="288" height="24" rx="7"
          fill="#0FA8FF" fill-opacity="0.09" stroke="#0FA8FF" stroke-opacity="0.35" stroke-width="1"/>
    <text x="662" y="178" text-anchor="middle"
          font-family="monospace" font-size="9" fill="#0FA8FF" letter-spacing="0.5">CLOUD-AUGMENTED (optional)</text>
  </g>

  <!-- Moving data particles along the pipeline -->
  <circle class="particle1" cx="154" cy="97" r="3.5" fill="#00D87F" fill-opacity="0.9"/>
  <circle class="particle2" cx="154" cy="97" r="3.5" fill="#00C9B1" fill-opacity="0.9"/>
  <circle class="particle3" cx="154" cy="97" r="3.5" fill="#0FA8FF" fill-opacity="0.9"/>
  <circle class="particle4" cx="154" cy="97" r="3.5" fill="#FFB800" fill-opacity="0.9"/>
</svg>

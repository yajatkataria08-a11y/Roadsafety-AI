      .r3  { animation-delay: 0.08s; }
      .r4  { animation-delay: 0.11s; }
      .r5  { animation-delay: 0.14s; }
      .r6  { animation-delay: 0.17s; }
      .r7  { animation-delay: 0.20s; }
      .r8  { animation-delay: 0.23s; }
      .r9  { animation-delay: 0.26s; }
      .r10 { animation-delay: 0.29s; }
      .r11 { animation-delay: 0.32s; }
      .r12 { animation-delay: 0.35s; }
      .r13 { animation-delay: 0.38s; }
      .r14 { animation-delay: 0.41s; }
      .r15 { animation-delay: 0.44s; }
      .r16 { animation-delay: 0.47s; }
      .r17 { animation-delay: 0.50s; }
      .r18 { animation-delay: 0.53s; }
      .r19 { animation-delay: 0.56s; }
      .r20 { animation-delay: 0.59s; }
      .r21 { animation-delay: 0.62s; }
      .r22 { animation-delay: 0.65s; }
      .r23 { animation-delay: 0.68s; }
      .r24 { animation-delay: 0.71s; }
      .r25 { animation-delay: 0.74s; }
      .r26 { animation-delay: 0.77s; }
      .r27 { animation-delay: 0.80s; }
      .r28 { animation-delay: 0.83s; }
      .r29 { animation-delay: 0.86s; }
      .r30 { animation-delay: 0.89s; }
      @keyframes fadeSlide {
        from { opacity: 0; transform: translateX(-10px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

      .barPulse { animation: barP 3s ease-in-out infinite; }
      @keyframes barP {
        0%,100% { fill-opacity: 1; }
        50%      { fill-opacity: 0.6; }
      }
    </style>
